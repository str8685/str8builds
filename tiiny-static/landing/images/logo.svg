<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="60" viewBox="0 0 180 60">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4ff" />
      <stop offset="100%" stop-color="#00e6ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Text part -->
  <g filter="url(#glow)">
    <!-- STR8 text -->
    <text x="10" y="40" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold" fill="#ffffff">STR8</text>
    
    <!-- BUILD text with gradient -->
    <text x="85" y="40" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold" fill="url(#logo-gradient)">BUILD</text>
  </g>
  
  <!-- Decorative elements -->
  <path d="M82 15 L82 45" stroke="#444" stroke-width="1" />
  <path d="M5 50 L175 50" stroke="url(#logo-gradient)" stroke-width="2" opacity="0.7" />
  
  <!-- Small construction icon -->
  <g transform="translate(160, 25) scale(0.5)">
    <path d="M0,0 L10,-15 L20,0 Z" fill="#ffffff" opacity="0.7" />
    <rect x="8" y="0" width="4" height="8" fill="#ffffff" opacity="0.7" />
  </g>
</svg>