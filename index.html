<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STR8 Build - Construction Tools</title>
    <style>
        :root {
            --primary: #4FEBFF;
            --primary-dark: #2B81FF;
            --background: #051D3B;
            --background-light: #102C4C;
            --text: #E6F4FF;
            --text-secondary: #B3D9FF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(90deg, var(--background), var(--background-light));
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 10px rgba(79, 235, 255, 0.3);
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            background: rgba(16, 44, 76, 0.7);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }
        
        .tool-btn {
            background: linear-gradient(145deg, #0c2440, #051d3b);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            transition: all 0.3s ease;
        }
        
        .tool-btn:hover, .tool-btn.active {
            background: linear-gradient(145deg, #051d3b, #0c2440);
            box-shadow: 0 0 15px rgba(79, 235, 255, 0.5);
            transform: translateY(-3px);
        }
        
        .tool-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .tool-name {
            font-size: 0.8rem;
        }
        
        .tool-content {
            background: rgba(16, 44, 76, 0.5);
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid var(--primary);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .tool-display {
            width: 100%;
            height: 300px;
            background: linear-gradient(145deg, #0c2440, #051d3b);
            border-radius: 10px;
            border: 1px solid var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .help-button {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            padding: 0;
            margin-left: 10px;
        }
        
        .help-button:hover {
            background-color: rgba(79, 235, 255, 0.1);
            transform: scale(1.1);
        }
        
        .btn {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 10px rgba(43, 129, 255, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(43, 129, 255, 0.5);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to right, var(--background), var(--background-light));
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 2px solid var(--primary);
            box-shadow: 0 -4px 15px rgba(79, 235, 255, 0.3);
        }
        
        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            padding: 8px 15px;
            border-radius: 10px;
        }
        
        .nav-item.active {
            color: var(--primary);
            background: rgba(79, 235, 255, 0.1);
            box-shadow: 0 0 15px rgba(79, 235, 255, 0.3);
        }
        
        .nav-item:hover {
            color: var(--primary);
            transform: translateY(-5px);
        }
        
        .nav-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .nav-text {
            font-size: 12px;
            font-weight: bold;
        }
        
        .level-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .bubble-level {
            width: 250px;
            height: 50px;
            background: #051D3B;
            border-radius: 25px;
            border: 2px solid var(--primary);
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(79, 235, 255, 0.3);
        }
        
        .bubble {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, var(--primary), var(--primary-dark));
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: calc(50% - 20px);
            transition: left 0.3s ease;
            box-shadow: 0 0 10px rgba(79, 235, 255, 0.7);
        }
        
        .marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--primary);
            left: 50%;
            transform: translateX(-50%);
        }
        
        .angle-display {
            position: absolute;
            bottom: 15px;
            font-size: 1.2rem;
            color: var(--primary);
            background: rgba(5, 29, 59, 0.8);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--primary);
        }
        
        @media (max-width: 768px) {
            .toolbar {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .tool-btn {
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">STR8 BUILD</div>
        <button class="help-button">?</button>
    </header>
    
    <main>
        <div class="toolbar">
            <button class="tool-btn active" data-tool="measure">
                <div class="tool-icon">📏</div>
                <div class="tool-name">Measure</div>
            </button>
            <button class="tool-btn" data-tool="level">
                <div class="tool-icon">📐</div>
                <div class="tool-name">Level</div>
            </button>
            <button class="tool-btn" data-tool="angle">
                <div class="tool-icon">⚙️</div>
                <div class="tool-name">Angle</div>
            </button>
            <button class="tool-btn" data-tool="calculator">
                <div class="tool-icon">🧮</div>
                <div class="tool-name">Calculator</div>
            </button>
            <button class="tool-btn" data-tool="camera">
                <div class="tool-icon">📸</div>
                <div class="tool-name">Project Cam</div>
            </button>
            <button class="tool-btn" data-tool="sound">
                <div class="tool-icon">🔊</div>
                <div class="tool-name">Sound Meter</div>
            </button>
        </div>
        
        <div class="tool-content">
            <div class="tool-display" id="toolDisplay">
                <!-- Level Tool Display -->
                <div class="level-container" id="levelTool" style="display: none;">
                    <div class="bubble-level">
                        <div class="marker"></div>
                        <div class="bubble" id="bubble"></div>
                    </div>
                    <div class="angle-display">0.0°</div>
                </div>
                
                <!-- Default Message -->
                <div id="defaultMessage">
                    <h2 style="color: var(--primary);">Select a tool to begin</h2>
                </div>
            </div>
            
            <button class="btn" id="actionButton">Calibrate</button>
        </div>
    </main>
    
    <div class="bottom-nav">
        <a href="#" class="nav-item">
            <div class="nav-icon">🏠</div>
            <div class="nav-text">Home</div>
        </a>
        <a href="#" class="nav-item active">
            <div class="nav-icon">🧰</div>
            <div class="nav-text">Tools</div>
        </a>
        <a href="#" class="nav-item">
            <div class="nav-icon">📊</div>
            <div class="nav-text">Projects</div>
        </a>
        <a href="#" class="nav-item">
            <div class="nav-icon">⏱️</div>
            <div class="nav-text">Timer</div>
        </a>
        <a href="#" class="nav-item">
            <div class="nav-icon">👤</div>
            <div class="nav-text">Profile</div>
        </a>
    </div>
    
    <script>
        // Tool selection functionality
        const toolButtons = document.querySelectorAll('.tool-btn');
        const actionButton = document.getElementById('actionButton');
        const toolDisplay = document.getElementById('toolDisplay');
        const defaultMessage = document.getElementById('defaultMessage');
        const levelTool = document.getElementById('levelTool');
        const bubble = document.getElementById('bubble');
        
        let currentTool = 'measure';
        
        toolButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Update active state
                toolButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // Update current tool
                currentTool = button.dataset.tool;
                
                // Update display based on tool
                updateToolDisplay();
            });
        });
        
        function updateToolDisplay() {
            // Reset displays
            defaultMessage.style.display = 'none';
            levelTool.style.display = 'none';
            
            // Set action button text
            switch(currentTool) {
                case 'measure':
                    actionButton.textContent = 'Calibrate';
                    defaultMessage.style.display = 'block';
                    defaultMessage.innerHTML = '<h2 style="color: var(--primary);">Measure Tool</h2><p>Tap to place measurement points</p>';
                    break;
                case 'level':
                    actionButton.textContent = 'Calibrate';
                    levelTool.style.display = 'flex';
                    simulateLevelMovement();
                    break;
                case 'angle':
                    actionButton.textContent = 'Reset';
                    defaultMessage.style.display = 'block';
                    defaultMessage.innerHTML = '<h2 style="color: var(--primary);">Angle Tool</h2><p>Draw to measure angles</p>';
                    break;
                case 'calculator':
                    actionButton.textContent = 'Calculate';
                    defaultMessage.style.display = 'block';
                    defaultMessage.innerHTML = '<h2 style="color: var(--primary);">Calculator Tool</h2><p>Construction-specific calculations</p>';
                    break;
                case 'camera':
                    actionButton.textContent = 'Take Photo';
                    defaultMessage.style.display = 'block';
                    defaultMessage.innerHTML = '<h2 style="color: var(--primary);">Project Cam</h2><p>Capture and save project photos</p>';
                    break;
                case 'sound':
                    actionButton.textContent = 'Start Measuring';
                    defaultMessage.style.display = 'block';
                    defaultMessage.innerHTML = '<h2 style="color: var(--primary);">Sound Meter</h2><p>Measure noise levels in decibels</p>';
                    break;
            }
        }
        
        // Simulate level tool movement
        function simulateLevelMovement() {
            let position = 50; // Center position
            let direction = 1;
            let angleDisplay = document.querySelector('.angle-display');
            
            setInterval(() => {
                position += direction * 0.5;
                
                if (position > 80) {
                    direction = -1;
                } else if (position < 20) {
                    direction = 1;
                }
                
                // Update bubble position
                bubble.style.left = `calc(${position}% - 20px)`;
                
                // Update angle display
                let angle = ((position - 50) / 50 * 45).toFixed(1);
                angleDisplay.textContent = `${angle}°`;
            }, 100);
        }
        
        // Initialize
        updateToolDisplay();
        
        // Bottom Nav Functionality
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navItems.forEach(navItem => navItem.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
