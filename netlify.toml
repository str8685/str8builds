[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "dist/functions"

[dev]
  command = "npm run dev"
  port = 8888

# Handle API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Handle all routes for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
