    <!-- Optimized loader removal script - improved for instant app display -->
    <script>
      (function() {
        // We'll use custom events from React to remove the loader
        // This ensures the loader is only removed when the app is truly ready

        // Flag to track if root has content
        let rootHasContent = false;
        
        // Function to remove the loader
        function removeLoader() {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            // Quick fade out
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.15s ease-out';
            
            // Remove after transition
            setTimeout(function() {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 150);
          }
        }

        // Set up an observer to watch for content in the root element
        const observer = new MutationObserver(function(mutations) {
          if (!rootHasContent && document.getElementById('root').children.length > 0) {
            rootHasContent = true;
            removeLoader();
            observer.disconnect();
          }
        });
        
        // Start observing when document is ready
        document.addEventListener('DOMContentLoaded', function() {
          const root = document.getElementById('root');
          observer.observe(root, { childList: true });
        });

        // Fallback removal methods (for safety)
        window.addEventListener('load', function() {
          setTimeout(function() {
            if (!rootHasContent) {
              console.log("Fallback: Removing loader after window load");
              removeLoader();
            }
          }, 500);
        });
        
        // Final failsafe - remove after max time
        setTimeout(function() {
          removeLoader();
        }, 2000);
      })();
    </script>
    
    <!-- Unregister any active service workers to fix flashing screen issue -->
    <script>
      // Unregister service workers directly in HTML instead of external file
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (const registration of registrations) {
            registration.unregister();
            console.log('Service worker unregistered:', registration);
          }
          
          // Also clear any caches
          if ('caches' in window) {
            caches.keys().then(function(cacheNames) {
              cacheNames.forEach(function(cacheName) {
                caches.delete(cacheName);
                console.log('Cache deleted:', cacheName);
              });
            });
          }
        });
      }
    </script>
