<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STR8 BUILD - Construction Project Management</title>
    <meta name="description" content="STR8 BUILD - Streamline your construction projects with our comprehensive project management platform." />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    
    <!-- Styles -->
    <link rel="stylesheet" href="./assets/style.css" />
    
    <style>
      /* Critical CSS */
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #0f172a;
      }
      .error {
        color: #ef4444;
        margin-top: 1rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div style="text-align: center;">
          <h1 style="color: #3b82f6;">Loading STR8 BUILD...</h1>
          <div id="loadingError" class="error"></div>
        </div>
      </div>
    </div>
    
    <script>
      // Error handling
      window.addEventListener('error', function(event) {
        const errorEl = document.getElementById('loadingError');
        if (errorEl) {
          errorEl.textContent = 'Loading error: ' + event.message;
        }
        console.error('Script loading error:', event);
      });

      // Load scripts in sequence
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }

      async function loadApp() {
        try {
          await loadScript('./assets/purify.es.js');
          await loadScript('./assets/index.es.js');
          await loadScript('./assets/index.js');
        } catch (error) {
          const errorEl = document.getElementById('loadingError');
          if (errorEl) {
            errorEl.textContent = 'Failed to load application scripts. Please check console for details.';
          }
          console.error('App loading error:', error);
        }
      }

      loadApp();
    </script>
  </body>
</html>
