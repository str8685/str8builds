<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STR8 BUILD - View Landing Page</title>
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f1729 0%, #121c36 100%);
      color: #f0f0f0;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 800px;
      padding: 2rem;
      background-color: rgba(30, 41, 59, 0.6);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    h1 {
      color: #38bdf8;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: #cbd5e1;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(to right, #0ea5e9, #2563eb);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 1rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      margin: 10px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      background: linear-gradient(to right, #0284c7, #1d4ed8);
    }
    .btn-secondary {
      background: transparent;
      border: 2px solid #38bdf8;
      color: #38bdf8;
    }
    .btn-secondary:hover {
      background: rgba(56, 189, 248, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>STR8 BUILD Landing Page</h1>
    <p>Click below to view the responsive landing page website created for your STR8 BUILD app.</p>
    
    <a href="/landing-page.html" class="btn">View Landing Page</a>
    <a href="/" class="btn btn-secondary">Return to App</a>
  </div>
</body>
</html>
