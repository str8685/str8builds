<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e1a" />
      <stop offset="100%" stop-color="#141629" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d30" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#252a45" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4ff" />
      <stop offset="100%" stop-color="#00e6ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
  </defs>
  
  <!-- Phone frame -->
  <rect width="600" height="800" rx="40" fill="url(#app-bg)" />
  <rect x="5" y="5" width="590" height="790" rx="38" fill="none" stroke="rgba(0, 230, 255, 0.3)" stroke-width="2" />
  
  <!-- Status bar -->
  <rect x="20" y="20" width="560" height="40" rx="10" fill="rgba(0,0,0,0.2)" />
  <circle cx="50" cy="40" r="8" fill="#fff" />
  <rect x="70" y="36" width="40" height="8" rx="4" fill="#fff" />
  <rect x="480" y="36" width="30" height="8" rx="4" fill="#fff" />
  <rect x="520" y="36" width="30" height="8" rx="4" fill="#fff" />
  
  <!-- App header -->
  <rect x="20" y="80" width="560" height="60" rx="10" fill="rgba(0,0,0,0.2)" />
  <text x="50" y="120" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">STR8<tspan fill="#00e6ff">BUILD</tspan></text>
  <circle cx="540" cy="110" r="15" fill="rgba(0, 230, 255, 0.2)" stroke="#00e6ff" stroke-width="2" />
  
  <!-- Main content -->
  <!-- Card 1 -->
  <rect x="20" y="160" width="560" height="120" rx="15" fill="url(#card-bg)" />
  <rect x="20" y="160" width="560" height="120" rx="15" fill="none" stroke="rgba(0, 230, 255, 0.2)" stroke-width="1" />
  <rect x="40" y="180" width="80" height="80" rx="10" fill="rgba(0, 230, 255, 0.1)" />
  <path d="M70 200 L90 220 L70 240" stroke="#00e6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <text x="140" y="210" font-family="Arial" font-size="20" font-weight="bold" fill="#fff">Current Project</text>
  <text x="140" y="240" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.7)">Auckland City Tower - Level 8</text>
  
  <!-- Card 2 - Calculator -->
  <rect x="20" y="300" width="270" height="200" rx="15" fill="url(#card-bg)" />
  <rect x="20" y="300" width="270" height="200" rx="15" fill="none" stroke="rgba(0, 230, 255, 0.2)" stroke-width="1" />
  <text x="40" y="340" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">Concrete Calculator</text>
  <rect x="40" y="360" width="230" height="40" rx="8" fill="rgba(0,0,0,0.3)" />
  <text x="50" y="385" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Length: 8.5 m</text>
  <rect x="40" y="410" width="230" height="40" rx="8" fill="rgba(0,0,0,0.3)" />
  <text x="50" y="435" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Width: 6.2 m</text>
  <rect x="120" y="460" width="150" height="30" rx="15" fill="url(#accent)" />
  <text x="155" y="480" font-family="Arial" font-size="14" font-weight="bold" fill="#070816">Calculate</text>
  
  <!-- Card 3 - Weather -->
  <rect x="310" y="300" width="270" height="200" rx="15" fill="url(#card-bg)" />
  <rect x="310" y="300" width="270" height="200" rx="15" fill="none" stroke="rgba(0, 230, 255, 0.2)" stroke-width="1" />
  <text x="330" y="340" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">Weather Impact</text>
  <circle cx="370" cy="400" r="40" fill="rgba(0, 230, 255, 0.1)" filter="url(#glow)" />
  <text x="370" y="410" font-family="Arial" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">18°</text>
  <line x1="420" y1="380" x2="550" y2="380" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="420" y="400" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Mostly Cloudy</text>
  <line x1="420" y1="410" x2="550" y2="410" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="420" y="430" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Wind: 12 km/h</text>
  <line x1="420" y1="440" x2="550" y2="440" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="420" y="460" font-family="Arial" font-size="14" fill="#00e6ff">Low impact on work</text>
  
  <!-- Card 4 - Job Timer -->
  <rect x="20" y="520" width="560" height="120" rx="15" fill="url(#card-bg)" />
  <rect x="20" y="520" width="560" height="120" rx="15" fill="none" stroke="rgba(0, 230, 255, 0.2)" stroke-width="1" />
  <text x="40" y="560" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">Active Job Timer</text>
  <text x="40" y="590" font-family="Arial" font-size="30" font-weight="bold" fill="#00e6ff">05:47:23</text>
  <rect x="420" y="550" width="140" height="40" rx="20" fill="rgba(0, 230, 255, 0.2)" stroke="#00e6ff" stroke-width="2" />
  <text x="465" y="575" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Stop Timer</text>
  
  <!-- Navigation -->
  <rect x="20" y="660" width="560" height="80" rx="20" fill="rgba(0,0,0,0.3)" />
  <g transform="translate(70, 700)">
    <circle cx="0" cy="0" r="20" fill="rgba(0, 230, 255, 0.2)" />
    <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#00e6ff" stroke-width="2" />
  </g>
  <g transform="translate(190, 700)">
    <circle cx="0" cy="0" r="20" fill="rgba(0, 230, 255, 0.2)" />
    <path d="M-10 -5 L10 -5 M-10 0 L10 0 M-10 5 L10 5" stroke="#00e6ff" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="translate(310, 700)">
    <circle cx="0" cy="0" r="25" fill="url(#accent)" />
    <text x="0" y="5" font-family="Arial" font-size="24" font-weight="bold" fill="#070816" text-anchor="middle">+</text>
  </g>
  <g transform="translate(430, 700)">
    <circle cx="0" cy="0" r="20" fill="rgba(0, 230, 255, 0.2)" />
    <path d="M-10 -10 L10 10 M-10 10 L10 -10" stroke="#00e6ff" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="translate(550, 700)">
    <circle cx="0" cy="0" r="20" fill="rgba(0, 230, 255, 0.2)" />
    <circle cx="0" cy="-8" r="3" fill="#00e6ff" />
    <path d="M-7 0 A7 7 0 0 0 7 0" stroke="#00e6ff" stroke-width="2" fill="none" />
  </g>
</svg>